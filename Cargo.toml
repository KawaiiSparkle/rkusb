[package]
name = "rkusb"
version = "0.2.1"
edition = "2024"
authors = ["Tnze <Tnze@tnze.tech>"]
license = "GPL-2.0"
description = "Library and CLI tools for manipulating Rockchip devices"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crc = "3.4.0"
env_logger = "0.11.11"
humantime = "2.3.0"
humansize = "2.1.3"
log = "0.4.33"
memmap2 = "0.9.11"
rusb = "0.9.4"
thiserror = "2.0.18"
zerocopy = { version = "0.8.54", features = ["derive", "simd"] }
rand = "0.10.2"
hex = "0.4.3"
rc4 = "0.2.0"
gpt = { version = "4.1.0", features = ["log"] }
